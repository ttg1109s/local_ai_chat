name: PHP CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-tests:
    name: PHP 8.4 regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, curl, pdo_sqlite, sqlite3, zip
          coverage: none

      # Some PHP integration/regression tests exercise the Python worker.
      - name: Setup Python for PHP integration tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agent-engines.txt

      - name: Install Python runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-agent-engines.txt

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -print0 | xargs -0 -n1 php -l

      - name: Run PHP regression suite
        run: sh tests/run_agent_suite.sh
