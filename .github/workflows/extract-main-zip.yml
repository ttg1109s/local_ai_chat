name: Extract main.zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract main.zip and remove wrapper directory
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="main.zip"
          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::Không tìm thấy main.zip ở thư mục gốc repository."
            exit 1
          fi

          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT

          unzip -q "$ZIP_FILE" -d "$WORK_DIR"

          # Bỏ lớp thư mục wraper/wrapper nếu có: copy nội dung bên trong
          # lên root repository, tuyệt đối không giữ lại thư mục bao ngoài.
          shopt -s dotglob nullglob
          entries=("$WORK_DIR"/*)
          wrapper_dir=""
          for entry in "${entries[@]}"; do
            if [[ -d "$entry" && ( "$(basename "$entry")" == "wraper" || "$(basename "$entry")" == "wrapper" ) ]]; then
              wrapper_dir="$entry"
              break
            fi
          done

          if [[ -n "$wrapper_dir" ]]; then
            cp -a "$wrapper_dir"/. .
            # Copy any other top-level archive entries, but skip wrapper directory.
            for entry in "${entries[@]}"; do
              [[ "$entry" == "$wrapper_dir" ]] && continue
              cp -a "$entry" .
            done
          else
            cp -a "$WORK_DIR"/. .
          fi

          rm -f "$ZIP_FILE"

      - name: Commit extracted files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Không có thay đổi để commit."
            exit 0
          fi
          git commit -m "Extract main.zip and remove archive"
          git push
